name: ROS2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container: ros:humble

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 更新源并安装编译依赖
      run: |
        apt update
        apt install -y python3-colcon-common-extensions python3-rosdep python3-pip build-essential
      shell: bash

    - name: 加载 ROS2 环境变量
      run: |
        echo "source /opt/ros/humble/setup.bash" >> ~/.bashrc
        source ~/.bashrc
        pip install pytest
      shell: bash

    - name: 编译项目 (Colcon Build)
      # 设置整个步骤的工作目录为代码根目录，彻底解决 cd 路径问题
      working-directory: ${{ github.workspace }}
      run: |
        source /opt/ros/humble/setup.bash
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: 运行测试 (Colcon Test)
      working-directory: ${{ github.workspace }}
      run: |
        source ${{ github.workspace }}/install/setup.bash
        colcon test
      shell: bash
