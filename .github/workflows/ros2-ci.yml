name: ROS2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container: ros:humble

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 更新源并安装编译依赖
      run: |
        apt update
        apt install -y python3-colcon-common-extensions python3-rosdep python3-pip build-essential
      shell: bash

    - name: 加载 ROS2 环境变量
      run: |
        echo "source /opt/ros/humble/setup.bash" >> ~/.bashrc
        source ~/.bashrc
        pip install pytest
      shell: bash

    - name: 编译项目 (Colcon Build)
      run: |
        source /opt/ros/humble/setup.bash
        # 使用 GitHub 自动分配的相对路径，不再依赖硬编码的绝对路径
        cd ${{ github.workspace }}
        # 编译当前工作空间下的所有包
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: 运行测试 (Colcon Test)
      run: |
        source /opt/ros/humble/setup.bash
        cd ${{ github.workspace }}
        # 运行所有包的测试，如果只想测试特定包，可以改为 --packages-select my_ci_pkg
        colcon test
      shell: bash
